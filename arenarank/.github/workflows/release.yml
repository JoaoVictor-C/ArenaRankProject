# Release — on push to main (and version tags): build the production image,
# push to ECR (immutable tag = git sha + the tag/branch alias), then deploy:
#   main          → staging   (auto)
#   v* tag        → production (gated by the `production` environment approval)
# Auth to AWS is via GitHub OIDC (no long-lived keys); the role ARN is the
# terraform iam module's github_actions_role_arn.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  id-token: write # OIDC → AWS
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: arenarank-backend

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    name: build + push image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: deploy → staging
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name arenarank-staging --region "$AWS_REGION"

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy with kustomize (staging overlay)
        # Pin the image to the freshly-pushed tag, then apply the overlay.
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ needs.build-push.outputs.image_tag }}"
          cd infrastructure/k8s/overlays/staging
          kubectl kustomize . \
            | sed "s#000000000000.dkr.ecr.us-east-1.amazonaws.com/arenarank-backend:staging#${IMAGE}#g" \
            | kubectl apply -f -

      - name: Wait for API rollout
        run: kubectl -n api rollout status deploy/api --timeout=300s

      - name: Smoke test (in-cluster /healthz)
        run: |
          kubectl -n api run smoke-$RANDOM --rm -i --restart=Never \
            --image=curlimages/curl:8.10.1 -- \
            curl -fsS http://api.api.svc.cluster.local/healthz

  deploy-production:
    name: deploy → production
    runs-on: ubuntu-latest
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production # requires manual approval (configure in repo settings)
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name arenarank-prod --region "$AWS_REGION"

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy with kustomize (production overlay)
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ needs.build-push.outputs.image_tag }}"
          cd infrastructure/k8s/overlays/production
          kubectl kustomize . \
            | sed "s#000000000000.dkr.ecr.us-east-1.amazonaws.com/arenarank-backend:latest#${IMAGE}#g" \
            | kubectl apply -f -

      - name: Wait for API rollout
        run: kubectl -n api rollout status deploy/api --timeout=600s

      - name: Wait for worker rollouts
        run: |
          kubectl -n processing rollout status deploy/processor-priority --timeout=600s
          kubectl -n processing rollout status deploy/processor-standard --timeout=600s
          kubectl -n processing rollout status deploy/ingestion --timeout=300s
          kubectl -n processing rollout status deploy/scheduler --timeout=300s
