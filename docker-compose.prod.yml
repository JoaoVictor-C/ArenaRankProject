# arenarank — PRODUCTION, single box. Same shape as the local stack, but
# production-configured: no embedded secrets, no dev conveniences.
#
# Postgres is EXTERNAL (AWS RDS) — DATABASE_URL comes from `.env`, never from
# this file. The frontend is on Amplify and adminer is dev-only, so neither is
# here. Everything else runs on this one box.
#
#   caddy             TLS origin for api.arenarank.lol (behind Cloudflare)
#   redis             cache / locks / arq queues / Riot token bucket
#   api               FastAPI (uvicorn) :8000, reached only through caddy
#   worker-sweep      discovery: sweep/rearm/reconcile/backfill cron ticks
#   worker-priority-sweep   Top-1000 sweep -> arena:priority
#   worker-standard / worker-priority   continuous process_match consumers
#   scheduler         season/leaderboard/cache/snapshots/rollups/replay
#   admin-console     operator UI, static build + /api proxy  (profile: admin)
#   migrate           one-shot: alembic upgrade head        (profile: ops)
#   seed              one-shot: idempotent season seed      (profile: ops)
#   audit-missing-matches   one-shot coverage audit         (profile: ops)
#
# Use this when ONE machine runs everything. If the API and the workers live on
# separate machines, use the split pair instead — do NOT combine them with this
# file, it would give you two schedulers:
#   docker-compose.prod-ec2.yml     public API only
#   docker-compose.prod-worker.yml  ingestion + maintenance
#
# Required in `.env` (never committed):
#   DATABASE_URL   postgresql+asyncpg://USER:PASS@<rds-host>:5432/arena
#   RIOT_API_KEY   ADMIN_API_KEY   CORS_ORIGINS   MATCH_MIN_STARTED_AT_MS
#
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
# Migrate:   docker compose -f docker-compose.prod.yml --profile ops run --rm migrate
# Seed:      docker compose -f docker-compose.prod.yml --profile ops run --rm seed

name: arenarank-prod

x-build: &build
  build:
    context: ./backend
    dockerfile: Dockerfile

# Every backend process reads the SAME .env. Per-service `environment:` below
# only sets what genuinely differs (service name, cache TTL, sweep sizing).
# Anything that must AGREE across processes — the season cutoff, the Riot key,
# the DB URL — lives in .env exactly once, so it cannot drift between the API
# and the workers.
x-env-file: &env-file
  env_file: [.env]

x-common-env: &common-env
  REDIS_URL: redis://redis:6379/0

# The image HEALTHCHECK curls :8000/healthz (the api role); workers run arq,
# so leaving it enabled marks them permanently unhealthy.
x-worker-svc: &worker-svc
  <<: [*build, *env-file]
  healthcheck:
    disable: true
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy

# Match payloads (~135 KB) only need to live in cache between fetch and rate.
# The consumers are what fetch+cache them via get_match; a 10 min TTL stops 24 h
# of payloads accumulating and blowing up Redis (this was the single biggest
# memory consumer before it was tuned).
x-consumer-env: &consumer-env
  <<: *common-env
  RIOT_MATCH_CACHE_TTL_SECONDS: "600"

services:
  # ------------------------------------------------------------------ #
  # Redis — cache, locks, arq queues, Riot token bucket.
  # volatile-lru so the disposable match cache (which has a TTL) is evicted
  # under pressure while queues and locks (no TTL) survive. NEVER noeviction:
  # a full Redis would start rejecting writes and stall the pipeline.
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--maxmemory", "${REDIS_MAXMEMORY:-512mb}",
        "--maxmemory-policy", "volatile-lru",
      ]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # API. --proxy-headers so uvicorn trusts caddy's X-Forwarded-* and records
  # the real client IP (the audit trail stores source_ip). No published host
  # port: reachable only through caddy, keeping :8000 off the public internet.
  # ------------------------------------------------------------------ #
  api:
    <<: [*build, *env-file]
    command:
      ["uvicorn", "arena.api.app:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*"]
    environment:
      <<: *common-env
      SERVICE_NAME: arenarank-api
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Caddy — TLS origin behind Cloudflare. `tls internal` (see Caddyfile)
  # because public ACME cannot validate here: the CF proxy intercepts the
  # HTTP-01/TLS-ALPN challenges. CF SSL/TLS mode must be "Full" so the
  # self-signed origin cert is accepted.
  # ------------------------------------------------------------------ #
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Discovery — a rotating DB cursor pages tracked players in bounded batches
  # and enqueues match ids as process_match jobs. Cursor-paged, tick-locked
  # (no overlap) and backpressured. Also hosts rearm / reconcile / history
  # backfill ticks.
  # ------------------------------------------------------------------ #
  worker-sweep:
    <<: *worker-svc
    command: ["arq", "arena.workers.main.SweepWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      <<: *common-env
      SERVICE_NAME: arenarank-worker-sweep
      SWEEP_INTERVAL_MINUTES: "${SWEEP_INTERVAL_MINUTES:-1}"
      SWEEP_BATCH_SIZE: "${SWEEP_BATCH_SIZE:-40}"
      SWEEP_MATCHES_PER_PLAYER: "${SWEEP_MATCHES_PER_PLAYER:-10}"

  worker-priority-sweep:
    <<: *worker-svc
    command: ["arq", "arena.workers.main.PrioritySweepWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      <<: *common-env
      SERVICE_NAME: arenarank-worker-priority-sweep

  # ------------------------------------------------------------------ #
  # Continuous process_match consumers — no cron, no idle window: each polls
  # its arq queue forever (arena:standard / arena:priority).
  # ------------------------------------------------------------------ #
  worker-standard:
    <<: *worker-svc
    command: ["arq", "arena.workers.main.StandardWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      <<: *consumer-env
      SERVICE_NAME: arenarank-worker-standard

  worker-priority:
    <<: *worker-svc
    command: ["arq", "arena.workers.main.PriorityWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      <<: *consumer-env
      SERVICE_NAME: arenarank-worker-priority

  # ------------------------------------------------------------------ #
  # Scheduler — EXACTLY ONE instance. Two would double-run season transitions
  # and the chronological replay; it is the one pool that does not scale out.
  # ------------------------------------------------------------------ #
  scheduler:
    <<: *worker-svc
    command: ["arq", "arena.workers.main.SchedulerWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      <<: *common-env
      SERVICE_NAME: arenarank-scheduler

  # ------------------------------------------------------------------ #
  # Admin console (profile: admin) — operator UI as a static build, served by
  # its own caddy which also reverse-proxies /api to the `api` service.
  #
  # Same-origin by design: the console's "local" preset uses an empty base and
  # a relative /api path, so proxying here needs no CORS entry and no absolute
  # URL. Bound to 127.0.0.1 and NOT routed through the public caddy — reach it
  # over an SSH tunnel, which is what provides the encryption:
  #   ssh -L 5174:127.0.0.1:5174 <box>   then open http://127.0.0.1:5174
  # ------------------------------------------------------------------ #
  admin-console:
    build:
      context: ./admin-console
      dockerfile: Dockerfile
    profiles: ["admin"]
    environment:
      ADMIN_API_UPSTREAM: api:8000
    ports:
      - "127.0.0.1:${ADMIN_CONSOLE_PORT:-5174}:8080"
    depends_on:
      - api
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Ops one-shots (profile: ops) — never started by `up`.
  #
  # migrate uses whatever DATABASE_URL says. Point it at the DIRECT Postgres
  # endpoint, never a transaction pooler: DDL and Timescale policy statements
  # are not transaction-pool safe.
  # ------------------------------------------------------------------ #
  migrate:
    <<: [*build, *env-file]
    profiles: ["ops"]
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true
    restart: "no"

  seed:
    <<: [*build, *env-file]
    profiles: ["ops"]
    command: ["python", "-m", "arena.db.seed"]
    environment:
      <<: *common-env
      SERVICE_NAME: arenarank-seed
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

  # Coverage audit — READ-ONLY. Competes for the same Riot token bucket as the
  # sweep, so run it off-peak and bound it with --max-api-calls:
  #   docker compose -f docker-compose.prod.yml --profile ops run --rm \
  #     audit-missing-matches --since-days 14 --max-api-calls 20000 --json /out/a.json
  audit-missing-matches:
    <<: [*build, *env-file]
    profiles: ["ops"]
    entrypoint: ["python", "-m", "scripts.audit_missing_matches"]
    environment:
      <<: *common-env
      SERVICE_NAME: arenarank-audit
      PYTHONIOENCODING: utf-8
    volumes:
      - ./out:/out
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: "no"

volumes:
  redisdata:
  caddy_data:
  caddy_config:
