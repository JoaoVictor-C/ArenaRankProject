# Alembic configuration — arenarank backend (async, asyncpg).
#
# The DSN is NOT stored here; env.py reads it from arena.core settings
# (DATABASE_URL) so migrations and the app share one source of truth.
# For DDL that bypasses PgBouncer (TimescaleDB policies, etc.) point
# DATABASE_URL at the direct (session-mode / non-pooled) endpoint when
# running migrations.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Timestamped, slug-friendly revision filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sqlalchemy.url is intentionally left blank — resolved in env.py.
sqlalchemy.url =

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
