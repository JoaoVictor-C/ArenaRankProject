[project]
name = "arenarank-backend"
version = "0.1.0"
description = "arenarank — CRS gamified rating platform (FastAPI). Proposal design, Python."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "httpx>=0.28",
    "arq>=0.26",
    "openskill>=5.1",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = ["ruff>=0.8", "mypy>=1.13", "pytest>=8.3", "pytest-asyncio>=0.24", "aiosqlite>=0.20"]
# OpenTelemetry tracing is optional — the app degrades to no-ops without it
# (arena.core.telemetry). Install ``.[otel]`` to export spans. Keep in sync with
# the versions the Dockerfile installs.
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

# opentelemetry is an optional extra ([otel]); when it isn't installed, treat its
# imports as untyped rather than failing the type check (arena.core.telemetry
# guards the runtime import and degrades to no-ops).
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arena"]
