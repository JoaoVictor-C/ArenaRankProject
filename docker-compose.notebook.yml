# arenarank — NOTEBOOK stack (metade de ESCRITA do split, T2.2 do
# workaround_readpath.md / docs/arquitetura-read-path.md).
#
# Este arquivo é a doc operacional do notebook (Celeron N4020, 8GB RAM,
# Ubuntu Server, ~/arenarank). Papel: fonte da verdade + ingestão. O EC2
# (docker-compose.prod.yml) fica só com a metade de LEITURA (caddy + api +
# redis de leitura + pg-replica) e assina a publicação lógica deste Postgres.
#
#   postgres      PRIMÁRIO (postgres:18) com wal_level=logical — publica as
#                 tabelas do read path (scripts/replication/create_publication.sql)
#   redis         escrita: filas arq, locks por jogador, token-bucket Riot,
#                 cache de payloads de match
#   worker-sweep  descoberta rotativa de partidas (substitui o IngestionWorker)
#   worker-priority-sweep  varre Top-1000, enfileira em arena:priority
#   worker-standard/worker-priority  consumidores contínuos de process_match
#                 (arq StandardWorker/PriorityWorker — sem cron, drenam a fila
#                 continuamente; substituem o worker-bulk antigo)
#   scheduler     manutenção cron (temporadas, snapshots, refresh)
#   api           OPCIONAL/LAN: console admin (telemetria de workers) e
#                 diagnóstico local — NÃO é o caminho público de leitura
#
# Segredos vêm do `.env` irmão (nunca commitado): POSTGRES_PASSWORD,
# DATABASE_URL, RIOT_API_KEY, ADMIN_API_KEY, RIOT_MATCH_CACHE_TTL_SECONDS
# (o notebook usa TTL de 7d no cache de match — Redis local tem 512mb,
# diferente do bulk do EC2 antigo que usava 600s com 128mb).
#
# Subir:    docker compose -f docker-compose.notebook.yml up -d --build
# Migrar:   docker compose -f docker-compose.notebook.yml run --rm api alembic upgrade head
#           (alembic SEMPRE aponta para este primário — DDL não replica; ver
#           docs/runbook-replicacao.md: réplica primeiro, primário depois)
# Publicação (T2.5): docker compose -f docker-compose.notebook.yml exec postgres \
#           psql -U arena -d arena -f /replication/create_publication.sql

name: arenarank-prod

services:
  redis:
    image: redis:7
    # 512mb + volatile-lru: mistura cache descartável (riot:match:*, com TTL)
    # com filas/locks (sem TTL). volatile-lru só evicta keys COM TTL — o cache
    # cede sob pressão, as filas ficam intactas. NUNCA noeviction aqui.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # API local (LAN) — telemetria/admin console + diagnóstico. O caminho público
  # de leitura é o EC2; este serviço pode ficar parado sem afetar o site.
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      ["uvicorn", "arena.api.app:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-api-notebook
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://arena:${POSTGRES_PASSWORD:?defina no .env}@postgres:5432/arena
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Sweep rotativo: cursor paginado sobre jogadores rastreados, empurra match
  # ids para a pending list. Substitui o IngestionWorker (poll_riot puxava TODOS
  # os jogadores por tick e estourava timeout com a ladder grande).
  # O HEALTHCHECK da imagem curla :8000/healthz (papel api); workers rodam arq,
  # não uvicorn — desabilitar ou ficam eternamente "unhealthy".
  worker-sweep:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.SweepWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-worker-sweep
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://arena:${POSTGRES_PASSWORD:?defina no .env}@postgres:5432/arena
      SWEEP_INTERVAL_MINUTES: "1"
      # Sweep de regime (21/07 v2): só as queues VIVAS (ARENA_LIVE_QUEUE_IDS,
      # default 1740+1750 — 1700/1710 têm zero partidas pós-cutoff, varrê-las
      # era desperdício puro) = 2 chamadas/player. 3000 players × 2 queues por
      # tick de 1min ≈ 100 rps (50% do teto do bucket match-v5:ids); volta
      # completa nos ~70k players em ~24min. O rider deep-sample (2 players/
      # tick, chamada SEM filtro de queue com startTime de 26h) é a rede de
      # segurança de rotação: queue id novo aparece ali e o parser CHERRY
      # processa. O rearm_tick (mesmo worker, 1/min) re-polla em 3min quem
      # acabou de ter partida processada -> partida seguinte da sessão no ar
      # em ~5min. Watermark 50k segue como backpressure.
      SWEEP_BATCH_SIZE: "3000"
      SWEEP_FETCH_CONCURRENCY: "64"
      SWEEP_MATCHES_PER_PLAYER: "10"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Priority sweep: varre o Top-1000 (PRIORITY_TOP_N) e enfileira process_match
  # em arena:priority (enqueue_job) — worker-priority abaixo consome
  # continuamente, sem esperar por tick. Isento do pressure_hold do watermark.
  # CONTÍNUO desde 21/07 (operação normal do design): top-1000 com partida
  # descoberta em <=5min. O modo catch-up (PRIORITY_SWEEP_SKIP_DEDUP=true)
  # fica só para runs sob demanda.
  worker-priority-sweep:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.PrioritySweepWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-worker-priority-sweep
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://arena:${POSTGRES_PASSWORD:?defina no .env}@postgres:5432/arena
      PRIORITY_SWEEP_INTERVAL_MINUTES: "5"
      PRIORITY_SWEEP_BATCH_SIZE: "200"
      SWEEP_MATCHES_PER_PLAYER: "10"
      PRIORITY_TOP_N: "1000"
      # Operação contínua: dedup NORMAL (seen-set). skip_dedup=true só em
      # catch-up sob demanda — contínuo re-enfileiraria os mesmos ids por tick.
      PRIORITY_SWEEP_SKIP_DEDUP: "false"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Consumidores contínuos de process_match — sem cron, sem janela ociosa: cada
  # um drena sua fila arq (arena:standard / arena:priority) assim que
  # worker-sweep/worker-priority-sweep enfileira (enqueue_job), até o limite de
  # concorrência de cada pool (max_jobs — 10 standard / 20 priority, definidos
  # em arena/workers/main.py, não configuráveis por env hoje). Substitui o
  # worker-bulk antigo (drenava uma lista Redis por timer, chamando
  # process_match em processo contra um ctx de arq falso).
  #
  # Força total (21/07). Round 3: caiu o funil app-wide 500/10s (não existe no
  # portal — limites são por método) e o match-v5 foi dividido em dois buckets
  # independentes (ids 2000/10s + matches/{id} 2000/10s), então o teto Riot
  # real do fetch é 200 rps. O limitador é o hardware (N4020 2-core + postgres
  # local), não a Riot — max_jobs 10+20=30 concorrentes entre os dois processos
  # fica perto do BULK_CONCURRENCY=32 já validado num processo só.
  worker-standard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.StandardWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-worker-standard
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://arena:${POSTGRES_PASSWORD:?defina no .env}@postgres:5432/arena
      # Pool asyncpg precisa acompanhar max_jobs (10) ou os jobs serializam na
      # espera de conexão. Mantém o MESMO orçamento total já validado
      # (32+8=40 conexões, cabe no max_connections=60 do postgres junto com
      # sweep/scheduler/api), agora dividido entre os dois processos
      # proporcionalmente ao max_jobs de cada um (10:20 -> 15:25).
      DB_POOL_SIZE: "12"
      DB_MAX_OVERFLOW: "3"
      # TTL do cache de payloads (riot:match:*) vem do .env — 7d no notebook
      # (RIOT_MATCH_CACHE_TTL_SECONDS=604800) para reaproveitar payloads em
      # backfills sem re-fetch; o Redis local (512mb, volatile-lru) comporta.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-priority:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.PriorityWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-worker-priority
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://arena:${POSTGRES_PASSWORD:?defina no .env}@postgres:5432/arena
      # max_jobs=20 aqui (vs 10 do standard) -> pool proporcionalmente maior.
      DB_POOL_SIZE: "22"
      DB_MAX_OVERFLOW: "3"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.SchedulerWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-scheduler
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://arena:${POSTGRES_PASSWORD:?defina no .env}@postgres:5432/arena
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
