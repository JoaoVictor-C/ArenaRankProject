# Local override — auto-merged by `docker compose` (no -f needed).
#
# The `api` service in docker-compose.yml sets its env via an inline
# `environment:` block and does NOT read backend/.env, so ADMIN_API_KEY added
# there never reaches the container. This injects it so the gated /admin/*
# surface (and the admin console) works. Keep the value in sync with
# backend/.env (ADMIN_API_KEY).
services:
  api:
    environment:
      ADMIN_API_KEY: "dev-super-secret"
      # Allow the admin console origin too (harmless for the proxied local flow,
      # required if you ever point a browser straight at :8000).
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
