# CI — runs on every push / PR. Per the project cadence this is LIGHT sanity:
# ruff (lint+format), mypy (strict, where it's free), an import smoke test, an
# `alembic check`, and a Docker build (no push). NO full test suite here — the
# comprehensive pytest pass is deferred to the final phase (master plan §5).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type:
    name: ruff + mypy + import + alembic
    runs-on: ubuntu-latest
    services:
      # alembic check / import smoke don't need a live DB (we use offline mode),
      # but a throwaway Postgres is handy if a future check wants it. Kept cheap.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      # Offline-friendly defaults; the import + alembic check don't connect.
      DATABASE_URL: "postgresql+asyncpg://arena:arena@localhost:5432/arena"
      REDIS_URL: "redis://localhost:6379/0"
      ENVIRONMENT: "ci"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.23"
          enable-cache: true

      - name: Install (locked deps + dev tools)
        # Reproducible from uv.lock; --frozen fails if the lock is stale.
        run: uv sync --frozen --extra dev --python 3.12

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format (check only)
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy arena

      - name: Import smoke test
        # Boots the import graph: app, workers, rating engine. Catches wiring
        # breakage without running a server.
        run: |
          uv run python -c "import arena.api.app; print('api import OK')"
          uv run python -c "import arena.workers.main; print('workers import OK')"
          uv run python -c "import arena.rating; print('rating import OK')"

      - name: Alembic check (offline)
        # Verifies the migration scripts import and the metadata is consistent.
        # `alembic check` compares models vs migrations; tolerate exit when a DB
        # isn't reachable by falling back to history (still validates scripts).
        run: |
          uv run alembic history >/dev/null
          uv run alembic check || echo "::warning::alembic check reported drift or no DB; review migrations"

  docker-build:
    name: docker build (no push)
    runs-on: ubuntu-latest
    needs: lint-type
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (cache only, no push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          load: false
          tags: arenarank-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
