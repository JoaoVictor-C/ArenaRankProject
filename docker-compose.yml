# arenarank — local development stack.
#
#   postgres   TimescaleDB (pg16)            : direct DB endpoint (5432)
#   redis      cache / locks / arq / token   : 6379
#   pgbouncer  TRANSACTION pool (web/API)    : 6432   (Trinity #9 dual-pool)
#   pgbouncer-session  SESSION pool (workers) : 6433   (Trinity #9 dual-pool)
#   migrate    one-shot: alembic upgrade head : runs once, then exits
#   seed       one-shot: idempotent dev seed  : runs once, then exits
#              (ACTIVE season + the SEED_PLAYERS Riot IDs as tracked players)
#   api        FastAPI (uvicorn)             : 8000  -> connects via tx pool
#   worker-sweep / worker-priority-sweep / scheduler
#              arq cron pools (discovery + maintenance)
#   worker-standard / worker-priority
#              arq continuous consumer pools (process_match, no cron)
#   adminer    web DB viewer                 : 8080  -> direct postgres endpoint
#   frontend   React + Vite dev server       : 5173  -> VITE_API_URL=:8000
#   audit-missing-matches  one-shot, read-only coverage audit (profile: audit)
#
# Trinity finding #9 (PgBouncer dual-pool): web requests use TRANSACTION mode
# (short-lived, high-concurrency), workers use SESSION mode (they hold advisory
# locks / prepared state across statements). We run two pgbouncer services so
# each role gets the right pooling semantics. Alembic migrations target the
# DIRECT postgres endpoint (5432) — DDL + TimescaleDB policy statements are not
# transaction-pool safe.
#
# Bring up (does everything — migrate, seed, all services): docker compose up --build
# Re-run migrate/seed manually only if you need to (both are idempotent):
#   docker compose run --rm migrate
#   docker compose run --rm seed

name: arenarank

services:
  # ------------------------------------------------------------------ #
  # PostgreSQL + TimescaleDB (pg16). The HA image ships the timescaledb
  # extension; the initial migration guards `CREATE EXTENSION`.
  # ------------------------------------------------------------------ #
  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: arena
      POSTGRES_PASSWORD: arena
      POSTGRES_DB: arena
    ports:
      - "5432:5432"   # direct endpoint — use this for `alembic upgrade`.
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arena -d arena"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Redis — cache, per-player locks, arq queues, Riot token-bucket.
  #
  # 2gb + volatile-lru: mixes disposable cache (riot:match:*, has a TTL —
  # see RIOT_MATCH_CACHE_TTL_SECONDS below) with queues/locks (no TTL).
  # volatile-lru only ever evicts keys WITH a TTL, so under memory pressure
  # the cache gives way first and the queues/locks stay intact — NEVER use
  # plain allkeys-* or noeviction here, either would risk losing in-flight
  # job data instead of failing loudly or evicting the disposable cache
  # (same reasoning already applied in docker-compose.notebook.yml).
  # mem_limit/cpus are an outer container-level backstop: without them a
  # Redis memory blowup (this happened for real — 6.87GB during one backlog,
  # crash-restarting Redis repeatedly and taking Docker Desktop's whole VM
  # down with it) can starve every other container on the box. With them,
  # the worst case is this ONE container getting OOM-killed and cleanly
  # restarting (restart: unless-stopped), not the whole stack.
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7
    command:
      [
        "redis-server",
        "--appendonly", "yes",
        "--maxmemory", "2gb",
        "--maxmemory-policy", "volatile-lru",
      ]
    mem_limit: 2560m
    cpus: 2.0
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # PgBouncer — TRANSACTION pool for the web/API tier (Trinity #9).
  # Short transactions, max connection reuse. statement_cache_size=0 is set
  # on the asyncpg side (arena/db/session.py) for tx-pool compatibility.
  # ------------------------------------------------------------------ #
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: arena
      DB_PASSWORD: arena
      DB_NAME: arena
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      LISTEN_PORT: "6432"
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # PgBouncer — SESSION pool for the worker tier (Trinity #9). Workers hold
  # session-scoped state (advisory locks, prepared statements) so they need
  # session mode, NOT transaction mode.
  # ------------------------------------------------------------------ #
  pgbouncer-session:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: arena
      DB_PASSWORD: arena
      DB_NAME: arena
      POOL_MODE: session
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "500"
      # SESSION mode holds one server connection per client session, so this is
      # the hard concurrency ceiling for the ENTIRE worker tier (sweep,
      # priority-sweep, standard/priority processors, scheduler, audit all
      # connect here) — not a per-service budget. 40 + the transaction pool's
      # 25 = 65 of postgres' 100 max_connections, leaving headroom for
      # migrations and adminer.
      DEFAULT_POOL_SIZE: "40"
      LISTEN_PORT: "6433"
    ports:
      - "6433:6433"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Migrate — one-shot: alembic upgrade head against the DIRECT postgres
  # port (DDL/Timescale policy statements are not tx-pool safe). Every
  # other service waits for this to exit 0 before starting, so a plain
  # `docker compose up --build` always boots against an up-to-date schema.
  # ------------------------------------------------------------------ #
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://arena:arena@postgres:5432/arena
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------ #
  # Seed — one-shot: idempotent dev seed (ACTIVE season + tracked players).
  # Safe to re-run any time via `docker compose run --rm seed`.
  #
  # SEED_PLAYERS is a comma-separated list of Riot IDs (gameName#tagLine).
  # Each is resolved to its REAL PUUID via account-v1 — the sweep workers poll
  # Riot by PUUID, so a synthetic id would 404 on every tick. That means the
  # seed needs RIOT_API_KEY and Redis (the Riot client's token bucket lives
  # there). Without a key the season is still seeded and the players are
  # skipped with a warning, so `compose up` never breaks.
  # ------------------------------------------------------------------ #
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "-m", "arena.db.seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://arena:arena@postgres:5432/arena
      REDIS_URL: redis://redis:6379/0
      RIOT_API_KEY: ${RIOT_API_KEY}
      SEED_PLAYERS: "${SEED_PLAYERS:-Presente#1001,CrazzyBoy#Br2}"
      LOG_LEVEL: INFO
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------ #
  # API — FastAPI (uvicorn). Default image CMD already runs uvicorn; we
  # restate it for clarity. Connects through the TRANSACTION pool (6432).
  # ------------------------------------------------------------------ #
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      ["uvicorn", "arena.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SERVICE_NAME: arenarank-api
      ENVIRONMENT: development
      # Launch-window cutoff (Temporada 1, 2026-07-26): ignore any Arena match
      # whose gameStartTimestamp is before 2026-07-17T00:00:00Z. Enforced in
      # match_pipeline.before_cutoff (worker-standard/priority) and backfill's
      # window floor (worker-sweep); harmless elsewhere.
      MATCH_MIN_STARTED_AT_MS: "1784246400000"
      # Web tier → PgBouncer transaction pool.
      DATABASE_URL: postgresql+asyncpg://arena:arena@pgbouncer:6432/arena
      REDIS_URL: redis://redis:6379/0
      RIOT_API_KEY: ${RIOT_API_KEY}
      # Browser runs on the host, so the Vite origin is localhost:5173.
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      ADMIN_API_KEY: "8e6efe29ab1937c3e87ecd96c94cc737"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgbouncer:
        condition: service_started
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Worker — SweepWorker: rotating sweep over ALL tracked players. Discovers
  # new match ids and enqueues them as process_match jobs on arena:standard
  # (worker-standard/worker-priority below consume them). Independently
  # start/stop (docker compose up/stop worker-sweep) or pause at runtime via the
  # admin API (arena:worker:enabled:sweep flag).
  # ------------------------------------------------------------------ #
  worker-sweep:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.SweepWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      SERVICE_NAME: arenarank-worker-sweep
      ENVIRONMENT: development
      MATCH_MIN_STARTED_AT_MS: "1784246400000"
      DATABASE_URL: postgresql+asyncpg://arena:arena@pgbouncer-session:6433/arena
      REDIS_URL: redis://redis:6379/0
      RIOT_API_KEY: ${RIOT_API_KEY}
      LOG_LEVEL: INFO
      SWEEP_INTERVAL_MINUTES: "5"
      SWEEP_BATCH_SIZE: "100"
      SWEEP_MATCHES_PER_PLAYER: "20"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer-session:
        condition: service_started
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Worker — PrioritySweepWorker: sweeps Top-1000 + admin-selected players and
  # enqueues process_match jobs on arena:priority (consumed by worker-priority).
  # ------------------------------------------------------------------ #
  worker-priority-sweep:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.PrioritySweepWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      SERVICE_NAME: arenarank-worker-priority-sweep
      ENVIRONMENT: development
      MATCH_MIN_STARTED_AT_MS: "1784246400000"
      DATABASE_URL: postgresql+asyncpg://arena:arena@pgbouncer-session:6433/arena
      REDIS_URL: redis://redis:6379/0
      RIOT_API_KEY: ${RIOT_API_KEY}
      LOG_LEVEL: INFO
      PRIORITY_SWEEP_INTERVAL_MINUTES: "5"
      PRIORITY_SWEEP_BATCH_SIZE: "200"
      SWEEP_MATCHES_PER_PLAYER: "20"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer-session:
        condition: service_started
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Workers — StandardWorker / PriorityWorker: continuous arq consumers.
  # sweep.py enqueues process_match jobs straight onto arena:standard /
  # arena:priority (enqueue_job); these poll their queue forever, no cron
  # tick and no idle window between batches. Replaces BulkProcessorWorker,
  # which drained a Redis LIST on a timer with process_match called
  # in-process against a hand-built fake arq ctx — the sweep pending lists
  # and their manual retry-attempts hash are gone along with it.
  # ------------------------------------------------------------------ #
  worker-standard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.StandardWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      SERVICE_NAME: arenarank-worker-standard
      ENVIRONMENT: development
      MATCH_MIN_STARTED_AT_MS: "1784246400000"
      DATABASE_URL: postgresql+asyncpg://arena:arena@pgbouncer-session:6433/arena
      REDIS_URL: redis://redis:6379/0
      RIOT_API_KEY: ${RIOT_API_KEY}
      LOG_LEVEL: INFO
      # Match payloads (~135KB) only ever get read again between fetch and
      # rate — this process is the one that fetches+caches them via
      # get_match(). Left at the 24h default, they're the single biggest
      # Redis memory driver (was: 6.87GB and climbing during a big backlog,
      # crash-restarting Redis and taking Docker Desktop with it). Same fix
      # already applied in docker-compose.prod.yml.
      RIOT_MATCH_CACHE_TTL_SECONDS: "600"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer-session:
        condition: service_started
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  worker-priority:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.PriorityWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      SERVICE_NAME: arenarank-worker-priority
      ENVIRONMENT: development
      MATCH_MIN_STARTED_AT_MS: "1784246400000"
      DATABASE_URL: postgresql+asyncpg://arena:arena@pgbouncer-session:6433/arena
      REDIS_URL: redis://redis:6379/0
      RIOT_API_KEY: ${RIOT_API_KEY}
      LOG_LEVEL: INFO
      RIOT_MATCH_CACHE_TTL_SECONDS: "600"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer-session:
        condition: service_started
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Scheduler — cron-only pool: season transitions, leaderboard refresh
  # (maintains TOP_PLAYERS_SET for priority routing), cache warm, cr-snapshot
  # maintenance. Single replica. Run alongside the sweep workers.
  # ------------------------------------------------------------------ #
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.SchedulerWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    environment:
      SERVICE_NAME: arenarank-scheduler
      ENVIRONMENT: development
      MATCH_MIN_STARTED_AT_MS: "1784246400000"
      DATABASE_URL: postgresql+asyncpg://arena:arena@pgbouncer-session:6433/arena
      REDIS_URL: redis://redis:6379/0
      RIOT_API_KEY: ${RIOT_API_KEY}
      LOG_LEVEL: INFO
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer-session:
        condition: service_started
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Adminer — lightweight web DB viewer for poking at Postgres in dev.
  # Open http://localhost:8080 — System "PostgreSQL", Server "postgres",
  # user / password / database all "arena". Connects to the DIRECT postgres
  # endpoint (not PgBouncer) so schema inspection and DDL behave normally.
  # Dev-only convenience; do not expose in production.
  # ------------------------------------------------------------------ #
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Frontend — React + Vite dev server. The browser (on the host) calls the
  # API directly at localhost:8000, so VITE_API_URL points there and the API
  # CORS allowlist includes 5173. node_modules is kept inside the container.
  # ------------------------------------------------------------------ #
  frontend:
    image: node:20-slim
    working_dir: /app
    command: ["sh", "-lc", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_URL: "http://localhost:8000"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Audit — one-shot, READ-ONLY: walks every player, asks Riot for their
  # match ids in the window, and reports who has matches we never computed.
  # Splits the gap into "never ingested" (discovery missed it) vs "participant
  # gap" (the match exists but this player has no row in it).
  #
  # Behind a profile so `docker compose up` never starts it — it burns Riot
  # budget. Run it explicitly, args after the service name:
  #   docker compose run --rm audit-missing-matches
  #   docker compose run --rm audit-missing-matches --since-days 30 --min-missing 10
  #   docker compose run --rm audit-missing-matches --json /out/audit.json
  #   docker compose run --rm audit-missing-matches --enqueue   # the only writing mode
  # ------------------------------------------------------------------ #
  audit-missing-matches:
    profiles: ["audit"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    entrypoint: ["python", "-m", "scripts.audit_missing_matches"]
    environment:
      SERVICE_NAME: arenarank-audit
      ENVIRONMENT: development
      # SESSION pool: this is a worker-shaped job, not a web request.
      DATABASE_URL: postgresql+asyncpg://arena:arena@pgbouncer-session:6433/arena
      REDIS_URL: redis://redis:6379/0
      RIOT_API_KEY: ${RIOT_API_KEY}
      LOG_LEVEL: INFO
      PYTHONIOENCODING: utf-8
    volumes:
      # --json lands on the host: `--json /out/audit.json` -> ./out/audit.json
      - ./out:/out
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      pgbouncer-session:
        condition: service_started
    restart: "no"

volumes:
  pgdata:
  redisdata:
  frontend_node_modules:
