# arenarank — PRODUCTION, EC2 box: THE PUBLIC API ONLY.
#
# Half of the split deployment. This box does exactly one job — serve the read
# API that the frontend talks to. It runs NO workers, so it never calls Riot,
# never writes match data, and its load is proportional to site traffic rather
# than to ingestion volume.
#
#   caddy   TLS origin for api.arenarank.lol (behind Cloudflare)
#   api     FastAPI (uvicorn) :8000, reached only through caddy
#   redis   LOCAL read cache — response cache + leaderboard ZSET
#
# Postgres is EXTERNAL (AWS RDS), shared with the worker box. DATABASE_URL comes
# from `.env`.
#
# ── Why this box has its OWN Redis, not a shared one ──────────────────────
# The obvious design is one Redis shared by both boxes, since the admin console
# reads queue depth / DLQ / worker-pause flags that live in the workers' Redis.
# We deliberately do NOT do that, because sharing would require either a private
# network between the boxes or a managed Redis, and it would put the hottest
# path in the system (the workers' per-match locks and Riot token bucket) across
# a network hop.
#
# Two facts make separate instances safe:
#
#   1. THE API NEVER CALLS RIOT. There is no RiotClient anywhere under
#      arena/api/ — the read path serves from Postgres and ddragon's keyless
#      CDN. So the Riot token bucket lives only on the worker box, and splitting
#      Redis does NOT split the rate limiter. There is no risk of the two boxes
#      each thinking they own the full quota and together burning the key.
#
#   2. THE LEADERBOARD CACHE IS READ-THROUGH. leaderboard_service warms its own
#      ZSET from Postgres on a miss (_read_through_zset -> _page_from_db +
#      _warm_from_db), so this box does not need the scheduler's cache-warm cron
#      to have written into ITS Redis.
#
# ── How the console still sees the workers from here ──────────────────────
# The worker box's scheduler publishes a telemetry snapshot (queue depths, per
# worker state, Riot bucket usage) into the SHARED RDS every minute, and this
# box reads it (WORKER_TELEMETRY_SOURCE=db below). That needs no route back to
# the notebook — the flow is outbound-only, which matters because it sits behind
# NAT and is sometimes asleep.
#
# The snapshot carries an `as_of`, so staleness is visible rather than silent:
# past worker_telemetry_stale_after_seconds the API reports `unavailable` and
# the console says "no signal for 14 min" instead of drawing an idle queue.
#
# Still tunnel-only, because they mutate the worker box's Redis: pausing a
# worker, requeueing the DLQ, and starting a season refill. For those, use the
# worker box's admin profile (docker-compose.prod-worker.yml).
#
# Required in `.env` (never committed):
#   DATABASE_URL   postgresql+asyncpg://USER:PASS@<rds-host>:5432/arena
#   ADMIN_API_KEY  CORS_ORIGINS   (RIOT_API_KEY is NOT needed here)
#
# Bring up:  docker compose -f docker-compose.prod-ec2.yml up -d --build
# Migrations run from the WORKER box, never here — one owner for schema.

name: arenarank-ec2

services:
  # ------------------------------------------------------------------ #
  # Redis — read cache only: whole-response cache (arena:api:cache:*) and the
  # leaderboard ZSET. Everything here is disposable and TTL'd, which is why
  # allkeys-lru is correct on THIS box and would be wrong on the worker box
  # (where evicting a queue would lose in-flight jobs).
  #
  # Small on purpose: a t3.micro has ~908 MB total and Postgres is remote, so
  # the page cache matters more than a big Redis.
  # ------------------------------------------------------------------ #
  redis:
    image: redis:7
    command:
      [
        "redis-server",
        "--maxmemory", "${REDIS_MAXMEMORY:-128mb}",
        "--maxmemory-policy", "allkeys-lru",
        "--save", "",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # API. --proxy-headers so uvicorn trusts caddy's X-Forwarded-* and records
  # the real client IP. No published host port: caddy is the only way in.
  #
  # DB_POOL_SIZE is deliberately modest — this box shares one RDS instance with
  # the worker box, and RDS connection slots are the scarce resource.
  # ------------------------------------------------------------------ #
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      ["uvicorn", "arena.api.app:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-api-ec2
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: "${DB_POOL_SIZE:-10}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-5}"
      # Telemetria vem do snapshot que a caixa de workers publica no RDS, NÃO do
      # Redis local — que não tem fila, heartbeat nem token-bucket e responderia
      # zeros convincentes. Medido antes deste ajuste: profundidade de fila 0
      # contra 166 reais, e todo worker como `active: false`. Ver
      # arena/services/telemetry_snapshot.py.
      WORKER_TELEMETRY_SOURCE: db
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # Caddy — TLS origin behind Cloudflare. `tls internal` (see Caddyfile):
  # public ACME cannot validate here because the CF proxy intercepts the
  # HTTP-01/TLS-ALPN challenges. CF SSL/TLS mode must be "Full".
  # ------------------------------------------------------------------ #
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
