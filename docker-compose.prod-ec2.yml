# arenarank — PRODUCTION stack (single t3.micro box).
#
# Database lives on AWS RDS (postgres 18, db.t3.micro), NOT in a container.
# Frontend runs on AWS Amplify. This box runs only: redis + api + a trimmed
# worker set. Secrets/config come from a sibling `.env` (never committed).
#
#   redis             cache / locks / arq queues / Riot token-bucket
#   api               FastAPI (uvicorn) on :8000 -> RDS direct
#   worker-sweep      arq SweepWorker (discovery: sweep/rearm/reconcile/backfill
#                     cron ticks; enqueues process_match onto arena:standard /
#                     arena:priority via enqueue_job)
#   worker-standard   arq StandardWorker (continuous process_match consumer,
#                     arena:standard — no cron, polls the queue forever)
#   worker-priority   arq PriorityWorker (same, arena:priority — rearm_tick's
#                     session re-polls land here even without a dedicated
#                     priority-sweep service on this trimmed box)
#   scheduler         arq SchedulerWorker (season/leaderboard/cache/snapshots)
#
# Deliberately trimmed for 908 MB RAM: no local postgres (RDS), no PgBouncer
# (app connects to RDS directly), no frontend (Amplify), no adminer, no
# dedicated priority-sweep service (rearm_tick, hosted inside worker-sweep,
# is this box's only priority-lane producer). Add PrioritySweepWorker back
# when the box is resized.
#
# Bring up:  docker compose -f docker-compose.prod.yml up -d --build
# Migrate:   docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
# Seed:      docker compose -f docker-compose.prod.yml run --rm api python -m arena.db.seed

name: arenarank-prod

services:
  redis:
    image: redis:7
    # maxmemory 128mb + volatile-lru: a Redis mistura cache descartável (riot:match:*,
    # TTL curto) com filas/locks (sem TTL). volatile-lru só evicta keys COM TTL quando
    # cheia, então o cache é descartado sob pressão e as filas ficam intactas — NUNCA
    # use noeviction aqui (rejeita escritas ao encher = pipeline morre).
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      ["uvicorn", "arena.api.app:app", "--host", "0.0.0.0", "--port", "8000",
       "--proxy-headers", "--forwarded-allow-ips", "*"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-api
      REDIS_URL: redis://redis:6379/0
    # No host port publish: the API is reached only via the caddy reverse proxy
    # (which Cloudflare fronts). Keeps :8000 off the public internet.
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Reverse proxy / TLS origin for api.arenarank.lol (behind Cloudflare).
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

  # Standard sweep: a rotating DB cursor pages tracked players in bounded batches
  # and enqueues discovered match ids as process_match jobs (arena:standard /
  # arena:priority via enqueue_job). This REPLACES the IngestionWorker
  # (poll_riot), which pulled ALL tracked players every tick and timed out once
  # the ladder grew past a few thousand players. The sweep is cursor-paged,
  # tick-locked (no overlap) and backpressured, so it scales. Also hosts
  # rearm_tick (session re-polls -> arena:priority) — this box's only
  # priority-lane producer, since there is no dedicated priority-sweep service.
  # The image HEALTHCHECK curls :8000/healthz (api role); workers run arq, not
  # uvicorn, so disable it or they'd flap to "unhealthy".
  worker-sweep:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.SweepWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-worker-sweep
      REDIS_URL: redis://redis:6379/0
      SWEEP_INTERVAL_MINUTES: "1"
      SWEEP_BATCH_SIZE: "40"
      SWEEP_MATCHES_PER_PLAYER: "10"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Continuous process_match consumers — no cron, no idle window: each polls
  # its arq queue forever (arena:standard / arena:priority) as soon as
  # worker-sweep's enqueue_job lands a job. Replaces BulkProcessorWorker, which
  # drained a Redis LIST on a timer with process_match called in-process
  # against a hand-built fake arq ctx.
  worker-standard:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.StandardWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-worker-standard
      REDIS_URL: redis://redis:6379/0
      # Payloads de match (~135KB) só vivem no cache entre fetch→rate. Este
      # processo é quem busca+cacheia via get_match; TTL 10min impede que se
      # acumulem 24h e estourem o Redis (era o principal consumidor de memória).
      RIOT_MATCH_CACHE_TTL_SECONDS: "600"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-priority:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.PriorityWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-worker-priority
      REDIS_URL: redis://redis:6379/0
      RIOT_MATCH_CACHE_TTL_SECONDS: "600"
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["arq", "arena.workers.main.SchedulerWorker", "--custom-log-dict", "arena.core.logging.ARQ_LOG_CONFIG"]
    env_file: [.env]
    environment:
      SERVICE_NAME: arenarank-scheduler
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redisdata:
  caddy_data:
  caddy_config:
