{{- $ns := .Values.namespaces.processing -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workers.serviceAccount.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "arenarank.labels" . | nindent 4 }}
  {{- with .Values.workers.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{/* ----- KEDA-scaled processor pools (priority + standard) ----- */}}
{{- range $lane := list "priority" "standard" }}
{{- $p := index $.Values.workers.processor $lane }}
{{- if $p.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor-{{ $lane }}
  namespace: {{ $ns }}
  labels:
    {{- include "arenarank.labels" $ | nindent 4 }}
    app.kubernetes.io/name: processor-{{ $lane }}
    app.kubernetes.io/component: worker
    arenarank.io/lane: {{ $lane }}
spec:
  replicas: {{ $p.minReplicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: processor-{{ $lane }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: processor-{{ $lane }}
        app.kubernetes.io/component: worker
        arenarank.io/lane: {{ $lane }}
    spec:
      serviceAccountName: {{ $.Values.workers.serviceAccount.name }}
      securityContext:
        {{- include "arenarank.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "arenarank.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["arq", {{ $p.arqClass | quote }}]
          env:
            - name: SERVICE_NAME
              value: "arenarank-processor-{{ $lane }}"
          envFrom:
            {{- include "arenarank.envFrom" $ | nindent 12 }}
          resources:
            {{- toYaml $.Values.workers.resources | nindent 12 }}
          livenessProbe:
            {{- include "arenarank.workerLiveness" $ | nindent 12 }}
          securityContext:
            {{- include "arenarank.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 90
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: processor-{{ $lane }}
  namespace: {{ $ns }}
  labels:
    {{- include "arenarank.labels" $ | nindent 4 }}
    arenarank.io/lane: {{ $lane }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: processor-{{ $lane }}
  minReplicaCount: {{ $p.minReplicas }}
  maxReplicaCount: {{ $p.maxReplicas }}
  pollingInterval: {{ $.Values.workers.processor.keda.pollingInterval }}
  cooldownPeriod: {{ $.Values.workers.processor.keda.cooldownPeriod }}
  triggers:
    - type: redis
      metadata:
        address: "{{ $.Values.redis.host }}:{{ $.Values.redis.port }}"
        listName: {{ $p.queueName | quote }}
        listLength: {{ $p.listLength | quote }}
        enableTLS: {{ $.Values.redis.enableTLS | quote }}
        databaseIndex: {{ $.Values.redis.databaseIndex | quote }}
{{- end }}
{{- end }}
{{/* ----- Singleton cron pools (ingestion + scheduler) ----- */}}
{{- range $role := list "ingestion" "scheduler" }}
{{- $w := index $.Values.workers $role }}
{{- if $w.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $role }}
  namespace: {{ $ns }}
  labels:
    {{- include "arenarank.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $role }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $role }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $role }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ $.Values.workers.serviceAccount.name }}
      securityContext:
        {{- include "arenarank.podSecurityContext" $ | nindent 8 }}
      containers:
        - name: {{ $role }}
          image: {{ include "arenarank.image" $ }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["arq", {{ $w.arqClass | quote }}]
          env:
            - name: SERVICE_NAME
              value: "arenarank-{{ $role }}"
          envFrom:
            {{- include "arenarank.envFrom" $ | nindent 12 }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
          livenessProbe:
            {{- include "arenarank.workerLiveness" $ | nindent 12 }}
          securityContext:
            {{- include "arenarank.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
{{- end }}
{{- end }}
