{{/* ConfigMap (and optional placeholder Secret) replicated into api + processing. */}}
{{- range $ns := list .Values.namespaces.api .Values.namespaces.processing }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arenarank-config
  namespace: {{ $ns }}
  labels:
    {{- include "arenarank.labels" $ | nindent 4 }}
    app.kubernetes.io/component: config
data:
  ENVIRONMENT: {{ $.Values.config.environment | quote }}
  SERVICE_NAME: {{ ternary "arenarank-api" "arenarank-worker" (eq $ns $.Values.namespaces.api) | quote }}
  LOG_LEVEL: {{ $.Values.config.logLevel | quote }}
  CORS_ORIGINS: {{ $.Values.config.corsOrigins | quote }}
  OTEL_TRACES_ENABLED: {{ $.Values.config.otelTracesEnabled | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ $.Values.config.otelEndpoint | quote }}
  ARENA_PRIORITY_QUEUE: {{ $.Values.config.queues.priority | quote }}
  ARENA_STANDARD_QUEUE: {{ $.Values.config.queues.standard | quote }}
  ARENA_DLQ_KEY: {{ $.Values.config.queues.dlq | quote }}
{{- end }}
{{- if .Values.secrets.create }}
{{- range $ns := list .Values.namespaces.api .Values.namespaces.processing }}
---
apiVersion: v1
kind: Secret
metadata:
  name: arenarank-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "arenarank.labels" $ | nindent 4 }}
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  DATABASE_URL: {{ ternary $.Values.secrets.databaseUrlApi $.Values.secrets.databaseUrlWorker (eq $ns $.Values.namespaces.api) | quote }}
  REDIS_URL: {{ $.Values.secrets.redisUrl | quote }}
  RIOT_API_KEY: {{ $.Values.secrets.riotApiKey | quote }}
{{- end }}
{{- end }}
