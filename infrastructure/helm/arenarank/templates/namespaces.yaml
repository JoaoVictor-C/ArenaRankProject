{{- if .Values.namespaces.create -}}
{{- range $tier, $ns := dict "api" .Values.namespaces.api "processing" .Values.namespaces.processing "data" .Values.namespaces.data "observability" .Values.namespaces.observability }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    {{- include "arenarank.labels" $ | nindent 4 }}
    arenarank.io/tier: {{ $tier }}
    {{- if or (eq $tier "api") (eq $tier "processing") }}
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    {{- else }}
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline
    {{- end }}
{{- end }}
{{- end -}}
