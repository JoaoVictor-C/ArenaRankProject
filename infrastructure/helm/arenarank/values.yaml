# Default values for the arenarank chart. Production-leaning; override per env
# with -f values-staging.yaml. Comments explain the non-obvious knobs.

# Container image (single image, role chosen by command). CI sets image.tag to
# the immutable release tag/digest.
image:
  repository: 000000000000.dkr.ecr.us-east-1.amazonaws.com/arenarank-backend
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Namespaces the chart expects to exist. createNamespaces=true makes the chart
# render Namespace objects (helm install --create-namespace handles only the
# release namespace, not these four).
namespaces:
  api: api
  processing: processing
  data: data
  observability: observability
  create: true

# Shared, non-secret config (maps to arena.core.config.Settings). Rendered into a
# ConfigMap in both the api and processing namespaces.
config:
  environment: production
  logLevel: INFO
  corsOrigins: "https://arenarank.gg,https://www.arenarank.gg"
  otelTracesEnabled: "true"
  otelEndpoint: "http://otel-collector.observability.svc.cluster.local:4317"
  queues:
    priority: "arena:priority"
    standard: "arena:standard"
    dlq: "arena:dlq"

# Secrets — set externally (External Secrets Operator) in real environments.
# When createSecret=true the chart renders a placeholder Secret (dev only).
secrets:
  create: false
  # api uses the PgBouncer tx pool (:6432); workers the session pool (:6433).
  databaseUrlApi: "postgresql+asyncpg://arena:CHANGE_ME@pgbouncer.data.svc:6432/arena"
  databaseUrlWorker: "postgresql+asyncpg://arena:CHANGE_ME@pgbouncer.data.svc:6433/arena"
  redisUrl: "redis://arenarank-redis.data.svc:6379/0"
  riotApiKey: "CHANGE_ME"

# Redis endpoint used by the KEDA trigger (host:port). ElastiCache primary.
redis:
  host: arenarank-redis.data.svc.cluster.local
  port: 6379
  enableTLS: false
  databaseIndex: 0

# ---------------------------------------------------------------------------- #
# API (web) — Deployment + Service + HPA + Ingress
# ---------------------------------------------------------------------------- #
api:
  enabled: true
  replicas: 3
  uvicornWorkers: 2
  serviceAccount:
    name: api
    annotations: {} # eks.amazonaws.com/role-arn for IRSA
  resources:
    requests: { cpu: "250m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    cpuUtilization: 60
    memoryUtilization: 75
  pdb:
    enabled: true
    minAvailable: 2
  ingress:
    enabled: true
    host: api.arenarank.gg
    certificateArn: "" # ACM ARN; empty disables HTTPS listener annotation
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"

# ---------------------------------------------------------------------------- #
# Worker pools — processor (KEDA-scaled) + ingestion/scheduler (singleton)
# ---------------------------------------------------------------------------- #
workers:
  serviceAccount:
    name: worker
    annotations: {} # IRSA for S3 archive writes
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }

  # KEDA-scaled match processors (two arq priority lanes).
  processor:
    priority:
      enabled: true
      arqClass: arena.workers.main.PriorityWorker
      queueName: "arena:priority"
      minReplicas: 2
      maxReplicas: 20
      # KEDA target list length per replica (proposal §10.4: scale when depth>500).
      listLength: 500
    standard:
      enabled: true
      arqClass: arena.workers.main.StandardWorker
      queueName: "arena:standard"
      minReplicas: 2
      maxReplicas: 20
      listLength: 500
    keda:
      pollingInterval: 15
      cooldownPeriod: 300 # 5 min idle → scale to min (§10.4)

  # Singleton cron pools (Recreate strategy; never two leaders).
  ingestion:
    enabled: true
    arqClass: arena.workers.main.IngestionWorker
    resources:
      requests: { cpu: "100m", memory: "192Mi" }
      limits: { cpu: "500m", memory: "384Mi" }
  scheduler:
    enabled: true
    arqClass: arena.workers.main.SchedulerWorker
    resources:
      requests: { cpu: "100m", memory: "192Mi" }
      limits: { cpu: "500m", memory: "384Mi" }
