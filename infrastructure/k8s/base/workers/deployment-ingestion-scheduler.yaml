# Ingestion poller + scheduler — both are single-replica, cron-driven pools
# (proposal §6.3, §13.1, §13.3). They are NOT KEDA-scaled: ingestion is a leader
# that polls Riot on a fixed cadence (a second replica would double-poll), and
# the scheduler runs maintenance cron (season transition, leaderboard/MV refresh,
# cache warm, cr_snapshots) which must be singleton.
#
# strategy: Recreate — never run two ingestion leaders concurrently during a
# rollout (avoids duplicate Riot polling / cursor races).
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  namespace: processing
  labels:
    app.kubernetes.io/name: ingestion
    app.kubernetes.io/part-of: arenarank
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion
        app.kubernetes.io/part-of: arenarank
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingestion
          image: ARENARANK_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["arq", "arena.workers.main.IngestionWorker"]
          envFrom:
            - configMapRef:
                name: arenarank-config
            - secretRef:
                name: arenarank-secrets
          env:
            - name: SERVICE_NAME
              value: "arenarank-ingestion"
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: processing
  labels:
    app.kubernetes.io/name: scheduler
    app.kubernetes.io/part-of: arenarank
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
        app.kubernetes.io/part-of: arenarank
        app.kubernetes.io/component: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: scheduler
          image: ARENARANK_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["arq", "arena.workers.main.SchedulerWorker"]
          envFrom:
            - configMapRef:
                name: arenarank-config
            - secretRef:
                name: arenarank-secrets
          env:
            - name: SERVICE_NAME
              value: "arenarank-scheduler"
          resources:
            requests:
              cpu: "100m"
              memory: "192Mi"
            limits:
              cpu: "500m"
              memory: "384Mi"
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,redis; redis.from_url(os.environ['REDIS_URL']).ping()"]
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 60
---
# Shared worker ServiceAccount (IRSA-annotated per overlay for S3 archive writes).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: processing
  labels:
    app.kubernetes.io/part-of: arenarank
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<acct>:role/arenarank-worker-irsa
