# API deployment — the public read + admin surface (FastAPI/uvicorn on :8000).
# HA: min 3 replicas (proposal §10.4 "minimum of 3 replicas for HA"). Autoscaled
# on CPU by the HPA (target 60%). Rolling, surge-up, zero-unavailable so the LB
# always has healthy backends.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: arenarank
    app.kubernetes.io/component: web
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: arenarank
        app.kubernetes.io/component: web
      annotations:
        # Prometheus scrape (annotation-based discovery). The app exposes app
        # metrics on the same port under /metrics (prometheus-fastapi-instrumentator
        # / our exporter); kube discovers via these annotations.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread across zones/nodes so a single AZ loss can't take the API down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      containers:
        - name: api
          image: ARENARANK_IMAGE # replaced by CI / overlay (ECR repo:tag)
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args:
            - "arena.api.app:app"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--proxy-headers"
            - "--forwarded-allow-ips=*"
            - "--workers=2"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: arenarank-config
            - secretRef:
                name: arenarank-secrets
          env:
            - name: SERVICE_NAME
              value: "arenarank-api"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          # Liveness: process is up. Readiness: ready to serve (same endpoint;
          # the app's /healthz checks the event loop). Startup gives the lifespan
          # (DB pool warm, telemetry wiring) room before liveness kicks in.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 30
