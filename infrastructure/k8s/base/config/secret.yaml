# Secret TEMPLATE — do NOT commit real values. In production these keys are
# populated by the External Secrets Operator from AWS Secrets Manager (see the
# ExternalSecret blocks) OR injected by CI for bootstrap. The `stringData`
# placeholders document the required shape and MUST be overridden.
#
# DATABASE_URL points at PgBouncer: the api uses the transaction pool (:6432),
# the workers use the session pool (:6433) — proposal §4 PgBouncer dual-pool /
# Trinity finding. Helm/overlays set the right port per workload. RDS is Multi-AZ
# Postgres 16 with TimescaleDB (cr_snapshots hypertable).
#
# One Secret per namespace (Secrets are namespace-scoped, referenced by both the
# api and processing pods).
---
apiVersion: v1
kind: Secret
metadata:
  name: arenarank-secrets
  namespace: api
  labels:
    app.kubernetes.io/part-of: arenarank
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://arena:CHANGE_ME@pgbouncer.data.svc.cluster.local:6432/arena"
  REDIS_URL: "redis://CHANGE_ME@arenarank-redis.data.svc.cluster.local:6379/0"
  RIOT_API_KEY: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: arenarank-secrets
  namespace: processing
  labels:
    app.kubernetes.io/part-of: arenarank
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Workers use the SESSION pool (:6433) — long-lived transactions / advisory
  # locks for the sequential per-player rating write (proposal §13.2, §11.2).
  DATABASE_URL: "postgresql+asyncpg://arena:CHANGE_ME@pgbouncer.data.svc.cluster.local:6433/arena"
  REDIS_URL: "redis://CHANGE_ME@arenarank-redis.data.svc.cluster.local:6379/0"
  RIOT_API_KEY: "CHANGE_ME"
---
# ExternalSecret (External Secrets Operator) for the api namespace. Reconciles
# AWS Secrets Manager → the Opaque Secret above. Apply only when ESO CRDs are
# installed (server-side validation skips unknown CRDs until then).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arenarank-secrets
  namespace: api
  labels:
    app.kubernetes.io/part-of: arenarank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: arenarank-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: arenarank/prod/database-url-tx
    - secretKey: REDIS_URL
      remoteRef:
        key: arenarank/prod/redis-url
    - secretKey: RIOT_API_KEY
      remoteRef:
        key: arenarank/prod/riot-api-key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arenarank-secrets
  namespace: processing
  labels:
    app.kubernetes.io/part-of: arenarank
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: arenarank-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: arenarank/prod/database-url-session
    - secretKey: REDIS_URL
      remoteRef:
        key: arenarank/prod/redis-url
    - secretKey: RIOT_API_KEY
      remoteRef:
        key: arenarank/prod/riot-api-key
