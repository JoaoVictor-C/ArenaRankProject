# ServiceMonitor / PodMonitor — tell the Prometheus Operator how to scrape the
# arenarank workloads. The API exposes /metrics on :8000; the arq workers expose
# a small metrics HTTP server on :9100 (they have no Service, so a PodMonitor
# scrapes them by pod label).
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: arenarank-api
  namespace: observability
  labels:
    app.kubernetes.io/part-of: arenarank
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["api"]
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: api
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arenarank-workers
  namespace: observability
  labels:
    app.kubernetes.io/part-of: arenarank
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames: ["processing"]
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  podMetricsEndpoints:
    - targetPort: 9100
      path: /metrics
      interval: 15s
      relabelings:
        - action: replace
          sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          targetLabel: job
